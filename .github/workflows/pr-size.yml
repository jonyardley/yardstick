name: PR size
on:
  pull_request:
    # edited: adding a "## Size" section to the description re-runs the check
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  pr-size:
    runs-on: ubuntu-latest
    steps:
      # The default ref is GitHub's merge of the pull request into its base;
      # depth 2 fetches that commit and its first parent (the base tip) only.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Added lines against the base (limit 800 without a Size section)
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: bash scripts/pr-size.sh HEAD^1 HEAD
